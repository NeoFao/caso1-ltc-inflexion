name: CI

# Corre en cada push y en cada PR. La suite no descarga datos ni modelos: usa
# paneles falsos y series sinteticas, para que un fallo de CI signifique siempre
# "alguien rompio algo" y nunca "la API de Binance estaba caida".
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Fijada al parche exacto, no a "3.14". En 3.14.0rc2 pydantic no puede
          # importar fastapi, y un error al importar un archivo de pruebas aborta
          # la recoleccion entera: la suite no falla, no corre. Ver issue #78.
          python-version: "3.14.7"

      - name: Instalar dependencias
        run: uv sync --group dev

      - name: Estilo
        run: uv run ruff check .

      - name: Pruebas
        run: uv run pytest -q

  # Las pruebas de extremo a extremo de la aplicacion existian desde el #90 pero
  # no corrian en ninguna parte automaticamente: solo cuando alguien se acordaba
  # de lanzarlas. El #144 -- Tiempo real mostrando el fundacional precalculado --
  # llego hasta la revision previa a la entrega justamente asi.
  #
  # No necesitan backend ni red: playwright.config.ts construye la app y la sirve
  # con `vite preview`, y los datos salen del respaldo estatico versionado en
  # app/public/datos/. Un fallo aqui significa siempre "alguien rompio algo".
  aplicacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        run: npm ci --prefix app

      - name: Instalar el navegador
        run: npx --prefix app playwright install --with-deps chromium

      - name: Pruebas de extremo a extremo
        run: npm run test:e2e --prefix app
